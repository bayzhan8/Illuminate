[project]
name = "corners-vs-centre"
version = "0.1.0"
description = "Code behind the simplex vs interior point visual guide"
requires-python = ">=3.10"
dependencies = ["illuminate", "lp-duality"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
